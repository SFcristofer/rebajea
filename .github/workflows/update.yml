name: Actualizar precios
on:
  schedule: [{cron: "0 0,4,12,16,20 * * *"}]  # mantener igual que RUN_HOURS_UTC en config.py
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MAX_RUN_MINUTES: 60
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python main.py
      - run: python buscar.py
      - run: python generate_site.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.db docs
          git diff --cached --quiet && exit 0
          git commit -m "Actualización de precios"
          git pull --rebase -X theirs
          git push
